[project]
name = "rerank-server"
version = "0.1.0"
description = "Mac-native MPS fp16 rerank server (TEI-compatible) for Hindsight-Crew"
requires-python = ">=3.12"
dependencies = [
    "torch==2.13.*",
    "sentence-transformers==5.6.1",
    "fastapi>=0.140,<0.141",
    "uvicorn>=0.51,<0.52",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
